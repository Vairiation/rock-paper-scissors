<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
</head>
<body>
    <script>
        // rock = 1
        // paper = 2
        // scissors = 3
        
        let userScore = 0;
        let computerScore = 0;

        function getComputerChoice() { // logic must stay in function for game to loop without reload
            return Math.floor(Math.random()*3 + 1); // computer chooses randomly
        }

        function getUserChoice() { // gets user's choice
            const userChoice = prompt('Rock, Paper, or Scissors?')?.toLowerCase(); // ?. is Optional Chaining: If the object accessed or function called using this operator is undefined or null, the expression short circuits and evaluates to undefined instead of throwing an error.

            if (userChoice === 'rock') {
                return 1;
            } else if (userChoice === 'paper') {
                return 2;
            } else if (userChoice === 'scissors') {
                return 3;
            } else if (userChoice === undefined) {
                stop();
            } else {
                alert('Please choose a valid option');
               return getUserChoice(); //restarts prompt if invalid option is chosen
            }            
        }

        function getWinner(userChoice, computerChoice) {
            if (userChoice === 1) {
                if (computerChoice === 1) { // both rock
                console.log('Tie! You both chose Rock');
                } else if (computerChoice === 3) { //computer chooses scissors
                    console.log('You won! Rock beats Scissors');
                    userScore += 1;
                } else if (computerChoice === 2) { // computer chooses paper
                    console.log('You lost! Paper beats rock');
                    computerScore += 1;
                }
            } else if (userChoice === 2) {
                if (computerChoice === 2) { // both paper
                    console.log('Tie! You both chose Paper');
                } else if (computerChoice === 1) { //computer chooses rock
                    console.log('You won! Paper beats Rock');
                    userScore += 1;
                } else if (computerChoice === 3) { // computer chooses scissors
                    console.log('You lost! Scissors beats Paper');
                    computerScore += 1;
                }
            } else if (userChoice === 3) {
                if (computerChoice === 3) { // both scissors
                    console.log('Tie! You both chose Scissors');
                } else if (computerChoice === 2) { //computer chooses paper
                    console.log('You won! Scissors beats Paper');
                    userScore += 1;
                } else if (computerChoice === 1) { // computer chooses rock
                    console.log('You lost! Rock beats Scissors');
                    computerScore += 1;
                }
            } else {
                alert('Invalid, please reload the page');
                console.log('Invalid, please reload the page');
            }
        }        
        function playRound() {
            const userChoice = getUserChoice();
            const computerChoice = getComputerChoice();

            if (userChoice === undefined) {
                console.log("If you'd like to play again, please reload the page or call playRound()");
                alert("If you'd like to play again, please reload the page"); 
                return false;
            } else {        
            getWinner(userChoice, computerChoice);
                return true;
            }
        }
        
        function startGame() {
            userScore = 0;
            computerScore = 0;
            
            for (let i = 0; i <= 4; i++) {
                if (!playRound()) {
                    return;
                } else {
                    console.log(`User: ${userScore} | Computer: ${computerScore}`);
                }
            }
            console.log(`Final Score: User: ${userScore} | Computer: ${computerScore} | Ties: ${5 - userScore - computerScore}`);
            alert(`Final Score: User: ${userScore} | Computer: ${computerScore} | Ties: ${5 - userScore - computerScore}`);
           if (userScore > computerScore) {
                console.log('Congrats! You beat the computer!');
                alert('Congrats! You beat the computer!');
            } else if (userScore < computerScore) {
                console.log('Bummer! You lost to a computer...');
                alert('Bummer! You lost to a computer...');
            } else {
                console.log('Looks like you tied with the computer. Should that be a compliment?');
                alert('Looks like you tied with the computer. Should that be a compliment?');
           }
        }

        startGame(); // starts game on reload/load
    </script>
</body>
</html>
