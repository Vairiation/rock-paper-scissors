        /* Pseudo Code
        Rock, paper, and scissors are assigned value (possibly 1-3)
        define winner selection (ie. rock beat paper, etc.)
        On function run, a value (1-3) is randomly chosen
        User inputs their choice
        User input is evaluated against computer's choice
        winner is displayed with console.log
        */
        
        const rock = 1;
        const paper = 2;
        const scissors = 3;
        let userValue;
        
        
        /*
        differentiate between user and computer winning
        - 3 separate scenarios based on user input
        rock beats scissors -> 1 + 3 = 4 = user wins
        paper beats rock -> 2 + 3 = 3 = user wins
        scissor beats paper -> 3 + 2 = 5 = user wins
        */

        function getRandomChoice() {

        function userChoseRock(input) {
            if (input === computerChoice) { // both rock
                console.log('Tie! You both chose Rock');
            } else if ((input + 2) === computerChoice) { //computer chooses scissors
                console.log('You won! Rock beats Scissors');
            } else if ((input + 1) === computerChoice) { // computer chooses paper
                console.log('You Lost! Paper beats rock');
            }
        }

        function userChosePaper(input) {
            if (input === computerChoice) { // both paper
                console.log('Tie! You both chose Paper');
            } else if ((input - 1) === computerChoice) { //computer chooses rock
                console.log('You won! Paper beats Rock');
            } else if ((input + 1) === computerChoice) { // computer chooses scissors
                console.log('You Lost! Scissors beats Paper');
            }
        }

        function userChoseScissors(input) {
            if (input === computerChoice) { // both scissors
                console.log('Tie! You both chose Scissors');
            } else if ((input - 1) === computerChoice) { //computer chooses paper
                console.log('You won! Scissors beats Paper');
            } else if ((input - 2) === computerChoice) { // computer chooses rock
                console.log('You Lost! Rock beats Scissors');
            }
        }        
        
        function setUserValue(input) { // sets user's value based on choice
            if (input === 'rock') {
                userValue = 1;
            } else if (input === 'paper') {
                userValue = 2;
            } else if (input === 'scissors') {
                userValue = 3;
            } else {
                alert('Please Choose a Valid Option');
                getUserInput(); //restarts prompt if invalid option is chosen
            }
        }

        function getUserInput() { // gets user's choice
            const userInput = prompt('Rock, Paper, or Scissors?').toLowerCase();
            
            setUserValue(userInput);
        }

        getUserInput();
    </script>
