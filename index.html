<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
</head>
<body>
    <script>
        /* Pseudo Code
        Done: 
        - Rock, paper, and scissors are assigned value (possibly 1-3) -- done
        - define winner selection (ie. rock beat paper, etc.) -- done
        - User inputs their choice -- done
        - User input is evaluated against computer's choice -- done
        - winner is displayed with console.log -- done

        Not Done:
        - Create Computer value function where (1-3) is randomly chosen
        - start getComputerValue function after user input
        */
        
        let userValue;
        let computerValue;
        // rock = 1
        // paper = 2
        // scissors = 3
        
        function getRandomChoice() { // logic must stay in function for game to loop without reload
            const computerChoice = Math.floor(Math.random()*3 + 1); // computer chooses randomly
            computerValue = computerChoice;
        }

        function userChoseRock(input) {
            if (input === computerValue) { // both rock
                console.log('Tie! You both chose Rock');
            } else if ((input + 2) === computerValue) { //computer chooses scissors
                console.log('You won! Rock beats Scissors');
            } else if ((input + 1) === computerValue) { // computer chooses paper
                console.log('You Lost! Paper beats rock');
            }
        }

        function userChosePaper(input) {
            if (input === computerValue) { // both paper
                console.log('Tie! You both chose Paper');
            } else if ((input - 1) === computerValue) { //computer chooses rock
                console.log('You won! Paper beats Rock');
            } else if ((input + 1) === computerValue) { // computer chooses scissors
                console.log('You Lost! Scissors beats Paper');
            }
        }

        function userChoseScissors(input) {
            if (input === computerValue) { // both scissors
                console.log('Tie! You both chose Scissors');
            } else if ((input - 1) === computerValue) { //computer chooses paper
                console.log('You won! Scissors beats Paper');
            } else if ((input - 2) === computerValue) { // computer chooses rock
                console.log('You Lost! Rock beats Scissors');
            }
        } 
        
        function setUserValue(input) { // sets user's value based on choice
            if (input === 'rock') {
                userValue = 1;
            } else if (input === 'paper') {
                userValue = 2;
            } else if (input === 'scissors') {
                userValue = 3;
            } else {
                alert('Please Choose a Valid Option');
                getUserInput(); //restarts prompt if invalid option is chosen
            }
        }

        function getUserInput() { // gets user's choice
            const userInput = prompt('Rock, Paper, or Scissors?').toLowerCase();
            
            setUserValue(userInput);
        }

        function getWinner() {
            if (userValue === 1) {
                userChoseRock(userValue);
            } else if (userValue === 2) {
                userChosePaper(userValue);
            } else if (userValue === 3) {
                userChoseScissors(userValue);
            } else {
                alert('Invalid, Please Reload the Page');
                console.log('Invalid, Please Reload the Page');
            }
        }        
        function startGame() {
            getUserInput();
            getRandomChoice();
            getWinner();
            startGame(); // restarts game perpetually so the user does not need to reload
        }
        
        startGame(); // starts game on reload/load
    </script>
</body>
</html>
